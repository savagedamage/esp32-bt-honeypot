; ESP32 Bluetooth Sacrificial Host ("honeypot")
;
; Two build environments, two different boards, because the two Bluetooth
; flavours live on different silicon:
;
;   [env:s3-ble-logger]   ESP32-S3  -> BLE 5 only (NO classic BT)
;                         BLE GATT central logger + honeypot peripheral
;
;   [env:esp32-bt-sink]   original ESP32 (micro-USB / CP2102) -> BT Classic + BLE
;                         SPP server that logs every byte a suspect device sends
;
; Build one with:   pio run -e s3-ble-logger   (or -e esp32-bt-sink)
; Flash:            pio run -e s3-ble-logger -t upload
; Monitor log:      pio device monitor -e s3-ble-logger
;
; Why the split: ESP32-S3 has BLE 5.0 but NO Bluetooth Classic (BR/EDR). The
; original ESP32 has BOTH. So classic headsets (A2DP/HFP/SPP) need the original
; board; BLE-only buds / companion-app traffic can use either (S3 preferred).

[platformio]
default_envs = s3-ble-logger

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

; ---------------------------------------------------------------------------
; BLE GATT logger + honeypot (ESP32-S3)
; ---------------------------------------------------------------------------
[env:s3-ble-logger]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_src_filter = +<*> -<bt_classic_sink.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DHONEYPOT_MODE_BLE
  -Wall -Wextra
lib_deps =
  h2zero/NimBLE-Arduino

; ---------------------------------------------------------------------------
; BT Classic SPP sink (original ESP32)
; ---------------------------------------------------------------------------
[env:esp32-bt-sink]
board = esp32dev
build_src_filter = +<*> -<ble_gatt_logger.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DHONEYPOT_MODE_BTCLASSIC
  -Wall -Wextra
; no external lib_deps — BluetoothSerial ships with the Arduino-ESP32 core
